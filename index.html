<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Bắn Súng Online - VNĐ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .game-section {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #ff6b6b;
        }

        .sidebar {
            width: 300px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #4ecdc4;
        }

        #gameCanvas {
            background: linear-gradient(to bottom, #0a0a0a, #1a1a1a);
            border: 3px solid #ff6b6b;
            border-radius: 5px;
            display: block;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            cursor: crosshair;
        }

        h1 {
            color: #ff6b6b;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        h2 {
            color: #4ecdc4;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid #4ecdc4;
            padding-bottom: 10px;
        }

        .stats {
            background: rgba(255, 107, 107, 0.1);
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 3px solid #ff6b6b;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .stat-label {
            color: #aaa;
        }

        .stat-value {
            color: #4ecdc4;
            font-weight: bold;
        }

        .money {
            color: #95e77d;
            font-size: 1.2em;
        }

        .gun-section {
            background: rgba(78, 205, 196, 0.1);
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 3px solid #4ecdc4;
        }

        .gun-button {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid #4ecdc4;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .gun-button:hover {
            transform: translateX(5px);
            box-shadow: 0 0 15px rgba(78, 205, 196, 0.5);
        }

        .gun-button.selected {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            border-color: #ff6b6b;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.7);
        }

        .gun-button.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .gun-info {
            font-size: 0.8em;
            color: #aaa;
            margin-top: 3px;
        }

        .code-section {
            background: rgba(149, 225, 125, 0.1);
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid #95e77d;
        }

        .code-input {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .code-input input {
            flex: 1;
            padding: 10px;
            border: 2px solid #95e77d;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-weight: bold;
        }

        .code-input button {
            padding: 10px 15px;
            background: #95e77d;
            border: none;
            border-radius: 5px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .code-input button:hover {
            background: #7ec967;
        }

        .notification {
            padding: 10px;
            background: rgba(149, 225, 125, 0.2);
            border: 1px solid #95e77d;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 0.85em;
            display: none;
            color: #95e77d;
        }

        .notification.error {
            background: rgba(255, 107, 107, 0.2);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .notification.success {
            background: rgba(78, 205, 196, 0.2);
            border-color: #4ecdc4;
            color: #4ecdc4;
        }

        .controls {
            background: rgba(255, 107, 107, 0.1);
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid #ff6b6b;
        }

        .control-text {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 8px;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .btn-reset {
            background: #ff6b6b;
            color: white;
        }

        .btn-reset:hover {
            background: #ee5a6f;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.5);
        }

        .btn-pause {
            background: #4ecdc4;
            color: white;
        }

        .btn-pause:hover {
            background: #3db5ae;
            box-shadow: 0 0 15px rgba(78, 205, 196, 0.5);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            #gameCanvas {
                max-width: 100%;
            }
        }

        .game-title {
            text-align: center;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-section">
            <h1>🎯 BẮN SÚNG ONLINE</h1>
            <div class="game-title">Nhấn chuột để bắn | Sử dụng WASD để di chuyển</div>
            <canvas id="gameCanvas" width="600" height="400"></canvas>
        </div>

        <div class="sidebar">
            <!-- Stats -->
            <div class="stats">
                <h2>📊 Thống kê</h2>
                <div class="stat-item">
                    <span class="stat-label">💰 Tiền:</span>
                    <span class="stat-value money" id="money">10,000 VNĐ</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">🎯 Điểm:</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">💥 Bắn trúng:</span>
                    <span class="stat-value" id="hits">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">📍 Phát:</span>
                    <span class="stat-value" id="shots">0</span>
                </div>
            </div>

            <!-- Gun Selection -->
            <div class="gun-section">
                <h2>🔫 Chọn súng</h2>
                <button class="gun-button selected" data-gun="pistol">
                    🔫 Súng lục (Miễn phí)
                    <div class="gun-info">DMG: 10 | Rate: 400ms</div>
                </button>
                <button class="gun-button" data-gun="rifle">
                    🎯 Súng trường (50 VNĐ)
                    <div class="gun-info">DMG: 30 | Rate: 600ms</div>
                </button>
                <button class="gun-button" data-gun="shotgun">
                    💥 Súng xịn (100 VNĐ)
                    <div class="gun-info">DMG: 50 | Rate: 800ms</div>
                </button>
                <button class="gun-button" data-gun="minigun">
                    🌪️ Súng máy (90 VNĐ)
                    <div class="gun-info">DMG: 5 | Rate: 50ms</div>
                </button>
                <button class="gun-button" data-gun="sniper">
                    🎯 Sniper (80 VNĐ)
                    <div class="gun-info">DMG: 100 | Rate: 1500ms</div>
                </button>
                <button class="gun-button" data-gun="laser">
                    ⚡ Súng laser (70 VNĐ)
                    <div class="gun-info">DMG: 40 | Rate: 200ms</div>
                </button>
            </div>

            <!-- Code Section -->
            <div class="code-section">
                <h2>🎁 Nhập mã khuyến mãi</h2>
                <div class="code-input">
                    <input type="text" id="codeInput" placeholder="VD: 10KV" maxlength="10">
                    <button onclick="applyCode()">Nhập</button>
                </div>
                <div class="notification" id="notification"></div>
                <div style="margin-top: 10px; font-size: 0.85em; color: #aaa;">
                    💡 Mã khuyến mãi:<br>
                    • 10KV → +10,000 VNĐ<br>
                    • 50KV → +50,000 VNĐ<br>
                    • 100KV → +100,000 VNĐ
                </div>
            </div>

            <!-- Controls -->
            <div class="controls" style="margin-top: 15px;">
                <h2>⚙️ Điều khiển</h2>
                <div class="button-group">
                    <button class="btn btn-reset" onclick="resetGame()">🔄 Làm mới</button>
                    <button class="btn btn-pause" id="pauseBtn" onclick="togglePause()">⏸️ Tạm dừng</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
